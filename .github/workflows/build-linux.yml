name: Linux build

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out the commit
        run: |
          git init --quiet
          git fetch --quiet --depth 1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          git checkout --quiet FETCH_HEAD
      - name: Build
        run: ./Scripts/Linux/Build.sh ${{ matrix.configuration }}